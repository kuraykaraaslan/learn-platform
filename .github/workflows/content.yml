name: content

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # lint + verify-code + test — the two gates docs/phases/README.md's
      # invariants require staying green, plus content-lint's
      # verify/stale-stamp and verify/hand-edited-output rules, which are
      # exactly what makes the `verified` and `proof` gates mean anything:
      # neither can be hand-set without this failing.
      - run: npm run content:check

      # Re-runs every `proof` fence's real command (content/_verify/) and
      # fails if a byte between its markers no longer matches what that
      # command actually produces today — catches both a hand-edit that
      # slipped past content:lint's offline self-consistency check, and a
      # behavior change (a tool's real output changed) that needs a re-stamp.
      - run: npx tsx scripts/stamp-verify.ts --check

      # Parses every `mermaid` fence with mermaid's own parser. Catches a
      # diagram that would only fail in a reader's browser — docs/phases/
      # 07-mermaid.md's readable-error fallback is the reader-facing net, this
      # is the author-facing one. `graph`/`stateDiagram-v2` need a DOM to
      # parse and are reported UNVERIFIED rather than failed; see the script
      # header for why that gap is stated instead of closed with jsdom.
      - run: npm run content:verify-mermaid

      # content:check is vitest + standalone scripts — none of it runs the
      # real Next.js/tsc build pipeline, which has its own type-checking
      # pass over files vitest never touches (route files, layouts) and its
      # own module-resolution behavior (client-vs-server bundle boundaries).
      # Both already caught a real bug apart from vitest in this repo's own
      # history: a type-only export missing from course_content.blocks.ts's
      # re-exports compiled fine under vitest but failed `next build`'s tsc
      # pass outright.
      # NEXT_PUBLIC_WEBCONTAINER_API_KEY is deliberately not set here —
      # confirmed directly (npm run build with .env.local removed, matching
      # what CI actually sees) that the build succeeds without it. It's only
      # read inside an async function a reader's click triggers at runtime
      # (runtime/webcontainer.client.ts), never during static generation.
      - run: npm run build
