name: content

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # lint + verify-code + test — the two gates docs/phases/README.md's
      # invariants require staying green, plus content-lint's
      # verify/stale-stamp and verify/hand-edited-output rules, which are
      # exactly what makes the `verified` and `proof` gates mean anything:
      # neither can be hand-set without this failing.
      - run: npm run content:check

      # Re-runs every `proof` fence's real command (content/_verify/) and
      # fails if a byte between its markers no longer matches what that
      # command actually produces today — catches both a hand-edit that
      # slipped past content:lint's offline self-consistency check, and a
      # behavior change (a tool's real output changed) that needs a re-stamp.
      - run: npx tsx scripts/stamp-verify.ts --check

      # Parses every `mermaid` fence with mermaid's own parser. Catches a
      # diagram that would only fail in a reader's browser — docs/phases/
      # 07-mermaid.md's readable-error fallback is the reader-facing net, this
      # is the author-facing one. `graph`/`stateDiagram-v2` need a DOM to
      # parse and are reported UNVERIFIED rather than failed; see the script
      # header for why that gap is stated instead of closed with jsdom.
      - run: npm run content:verify-mermaid

      # Rebuilds the concept coverage report and fails if it differs from what is
      # committed. The report records which lessons each glossary term links in,
      # so this is a regression guard on *linking behaviour*: a change that
      # silently starts or stops linking somewhere has to show up as a diff
      # someone explains, instead of shipping unnoticed.
      #
      # Scope stated honestly: this would not have caught the BASE bug
      # (af2f3ea), because that shipped wrong from the beginning and the report
      # faithfully recorded the wrong state as normal. What it does is stop a
      # fixed one from coming back — verified by re-introducing it (a lowercase
      # alias on the acronym) and watching this exit 1.
      - run: npm run content:concepts-check

      # ESLint, which nothing else here runs. Verified empirically rather than
      # assumed: with a deliberate `@typescript-eslint/no-explicit-any` error
      # planted in modules/shared/useMounted.ts, `npm run build` still exited 0
      # — Next 16 does not lint during build. The same experiment with a type
      # error (`const x: number = "s"`) DID fail the build with TS2322, which is
      # why `tsc --noEmit` has no step of its own: the build genuinely covers it.
      #
      # Without this the config's own promoted rule is unenforced. eslint.config
      # .mjs turns `react/no-danger` on as an `error` precisely because the six
      # deliberate dangerouslySetInnerHTML sites all carry a documented reason —
      # a seventh, unannotated one is meant to fail the build, and until now
      # nothing would have.
      - run: npm run lint

      # content:check is vitest + standalone scripts — none of it runs the
      # real Next.js/tsc build pipeline, which has its own type-checking
      # pass over files vitest never touches (route files, layouts) and its
      # own module-resolution behavior (client-vs-server bundle boundaries).
      # Both already caught a real bug apart from vitest in this repo's own
      # history: a type-only export missing from course_content.blocks.ts's
      # re-exports compiled fine under vitest but failed `next build`'s tsc
      # pass outright.
      # NEXT_PUBLIC_WEBCONTAINER_API_KEY is deliberately not set here —
      # confirmed directly (npm run build with .env.local removed, matching
      # what CI actually sees) that the build succeeds without it. It's only
      # read inside an async function a reader's click triggers at runtime
      # (runtime/webcontainer.client.ts), never during static generation.
      # Every committed report must equal what its script produces today.
      # The steps above already RUN most of these generators, but none of them
      # compares the result against what is in the repo — so a committed report
      # can drift and quietly mislead whoever reads it, which is exactly what
      # the phases README's baseline table had done (fec2365). mistakes.json is
      # the sharpest case: until now nothing in CI produced it at all, so P2's
      # own acceptance numbers could go stale unnoticed.
      #
      # content:concepts-check above still earns its place: it fires earlier and
      # names the semantic cause ("concept linking changed"), where this one only
      # reports a diff.
      - run: npm run content:reports
      - run: git diff --exit-code -- content/_reports

      - run: npm run build
